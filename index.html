<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Média Escolar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Sistema de Média Escolar</h1>

    <p>Nome do aluno:</p>
    <input type="text" id="nome">

    <p>Primeira nota:</p>
    <input type="number" id="nota1" min="0" max="10">

    <p>Segunda nota:</p>
    <input type="number" id="nota2" min="0" max="10">

    <br><br>
    <button id="calcular">Calcular média</button>

    <p id="resultado"></p>

    <script src="script.js"></script>
</body>
</html>
